<body class="bg-surface h-full w-full flex text-on-surface antialiased overflow-hidden">
<!-- SideNavBar (Suppressed for focused Settings/Transactional view per guidelines, but user requested in context of Settings, let's keep it minimal if we were to show it, but wait: "You MUST exclude the navigation shell if the page intent is: Linear/Transactional or Task-Focused: Any sub-page featuring a "Close" or "Back" action that implies a temporary departure from the main navigation flow." - Changing email is a highly focused sub-task. I will suppress the global nav to prioritize the canvas, adhering strictly to the "Shell Visibility & Relevance" mandate.) -->
<!-- Main Content Area -->
<main class="flex-1 flex flex-col h-full w-full max-w-[1280px] mx-auto relative z-10 overflow-y-auto">
<!-- Header / Back Action -->
<div class="w-full flex items-center justify-between px-margin-desktop py-lg border-b border-outline-variant bg-surface-container-lowest shadow-sm z-20">
<div class="flex items-center gap-sm">
<button class="p-xs text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Account Settings</h1>
</div>
<!-- Optional close for modal-like feel -->
<button class="p-xs text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Scrollable Content Canvas -->
<div class="flex-1 p-margin-desktop flex items-start justify-center">
<!-- Focused Card Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] border border-outline-variant overflow-hidden mt-2xl">
<!-- Card Header -->
<div class="px-xl py-lg border-b border-outline-variant bg-surface-container-lowest">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Change Email</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Update your primary email address. This will be used for login and important notifications.</p>
</div>
<!-- Form Area -->
<form class="p-xl flex flex-col gap-lg">
<!-- Current Email Display (Read-only) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Current Email</label>
<div class="flex items-center px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg">
<span class="material-symbols-outlined text-secondary mr-sm" style="font-variation-settings: 'FILL' 0;">mail</span>
<span class="font-body-md text-body-md text-secondary">admin@taskmaster.enterprises</span>
</div>
</div>
<div class="h-px bg-outline-variant w-full my-xs"></div>
<!-- New Email Input -->
<div class="flex flex-col gap-xs group relative">
<label class="font-label-md text-label-md text-on-surface" for="new_email">New Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors">alternate_email</span>
</div>
<input class="w-full pl-3xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="new_email" name="new_email" placeholder="e.g. new.email@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Verification Input -->
<div class="flex flex-col gap-xs group relative">
<label class="font-label-md text-label-md text-on-surface" for="current_password">Current Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full pl-3xl pr-[48px] py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="current_password" name="current_password" placeholder="Verify it's you" required="" type="password"/>
<!-- Visibility Toggle -->
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-primary transition-colors" title="Toggle password visibility" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Required to confirm sensitive changes.</p>
</div>
<!-- Form Actions -->
<div class="mt-lg flex gap-md justify-end">
<button class="px-md py-sm font-label-md text-label-md text-secondary hover:text-on-surface transition-colors" type="button">
                            Cancel
                        </button>
<button class="px-lg py-sm bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-[#1D4ED8] transition-colors shadow-sm flex items-center gap-xs" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
                            Verify New Email
                        </button>
</div>
</form>
</div>
</div>
