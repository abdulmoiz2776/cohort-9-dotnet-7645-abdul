            background-color: theme('colors.background');

<body class="antialiased text-on-background min-h-screen flex flex-col">
<!-- Header suppressed as per Semantic Shell Mandate for Transactional/Linear intent (Sign-up) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-[1280px] mx-auto">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] p-[1.25rem]">
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-on-surface mb-sm tracking-tight font-bold">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join TaskMaster today.</p>
</div>
<form class="space-y-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<input class="w-full h-12 px-sm py-xs bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container shadow-[0_0_4px_rgba(37,99,235,0.1)] transition-all" id="fullName" name="fullName" required="" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="w-full h-12 px-sm py-xs bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container shadow-[0_0_4px_rgba(37,99,235,0.1)] transition-all" id="email" name="email" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<input class="w-full h-12 px-sm py-xs bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container shadow-[0_0_4px_rgba(37,99,235,0.1)] transition-all" id="password" name="password" required="" type="password"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 px-sm py-xs bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container shadow-[0_0_4px_rgba(37,99,235,0.1)] transition-all" id="confirmPassword" name="confirmPassword" required="" type="password"/>
</div>
<div class="flex items-center gap-sm mt-lg mb-lg">
<input class="w-4 h-4 rounded text-primary-container border-outline-variant focus:ring-primary-container focus:ring-offset-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none cursor-pointer" for="terms">
                        I agree to the <a class="text-primary-container hover:underline hover:text-[#1D4ED8] transition-colors" href="#">Terms and Conditions</a>
</label>
</div>
<button class="w-full h-12 bg-[#2563EB] hover:bg-[#1D4ED8] text-[#FFFFFF] rounded-lg font-label-md text-label-md transition-colors shadow-sm flex items-center justify-center gap-sm" type="submit">
                    Create Account
                    <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-md text-label-md text-primary-container hover:underline hover:text-[#1D4ED8] transition-colors ml-xs" href="#">Log in instead</a>
</p>
</div>
</div>
</main>
