<body class="bg-surface-container-low min-h-screen flex flex-col text-on-surface">
<!-- TopNavBar: SUPPRESSED because this is a transactional flow (Reset Password) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Background Decorative Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-30 blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-fixed opacity-30 blur-3xl"></div>
</div>
<div class="z-10 w-full max-w-[480px]">
<!-- Logo Context -->
<div class="text-center mb-xl">
<div class="font-headline-lg text-headline-lg text-primary tracking-tight mb-sm">TaskMaster</div>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access recovery</p>
</div>
<!-- Reset Password Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg md:p-xl border border-outline-variant shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] relative">
<!-- Inner Brand Accent -->
<div class="absolute top-0 left-0 w-full h-[4px] bg-primary rounded-t-xl"></div>
<div class="mb-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Reset Password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Please enter your new password below. Ensure it is strong and memorable.
                    </p>
</div>
<form class="flex flex-col gap-md">
<!-- New Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-shadow" id="new-password" name="new-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="mt-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="info">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant font-normal">Must be at least 8 characters</p>
</div>
</div>
<!-- Confirm New Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirm-password">Confirm New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock_reset">lock_reset</span>
<input class="w-full pl-10 pr-10 py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-shadow" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Password Strength Indicator (Visual Polish) -->
<div class="py-sm">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">Password Strength</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">--</span>
</div>
<div class="flex gap-1 h-1.5 w-full">
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Actions -->
<div class="pt-sm flex flex-col gap-sm">
<button class="w-full py-[10px] px-md bg-primary hover:bg-[#1D4ED8] text-on-primary font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center gap-sm" type="button">
                            Reset Password
                            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<a class="w-full py-[10px] px-md bg-transparent text-secondary hover:text-primary font-label-md text-label-md rounded-lg transition-colors flex items-center justify-center" href="#">
                            Back to Sign In
                        </a>
</div>
</form>
</div>

<span>•</span>
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
</div>

</main>
<script>
        // Simple password toggle logic for visual interaction
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = document.getElementById('new-password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
