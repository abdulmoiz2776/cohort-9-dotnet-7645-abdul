<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Task - TaskMaster</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "primary-fixed": "#dbe1ff",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#e4f2ff",
                        "on-error": "#ffffff",
                        "outline": "#737686",
                        "inverse-surface": "#2d3133",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "primary": "#004ac6",
                        "tertiary": "#005a82",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "error": "#ba1a1a",
                        "on-primary-container": "#eeefff",
                        "secondary": "#505f76",
                        "tertiary-container": "#0074a6",
                        "surface-dim": "#d8dadc",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#001e2f",
                        "on-background": "#191c1e",
                        "tertiary-fixed": "#c9e6ff",
                        "surface-container": "#eceef0",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-container": "#54647a",
                        "on-primary-fixed": "#00174b",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "surface-container-highest": "#e0e3e5",
                        "surface": "#f7f9fb",
                        "primary-container": "#2563eb",
                        "surface-container-high": "#e6e8ea",
                        "outline-variant": "#c3c6d7",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#f2f4f6",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary-container": "#d0e1fb",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#434655",
                        "tertiary-fixed-dim": "#89ceff",
                        "background": "#f7f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "base": "4px",
                        "margin-desktop": "40px",
                        "3xl": "64px",
                        "xl": "32px",
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "2xl": "48px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #F8FAFC; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-surface-bright text-on-surface flex h-screen overflow-hidden antialiased">
<!-- SideNavBar -->
<nav class="bg-surface-container-lowest text-primary font-label-md text-label-md h-screen w-64 fixed left-0 top-0 border-r border-outline-variant shadow-sm flex flex-col h-full p-md gap-sm hidden md:flex z-50">
<div class="flex items-center gap-sm px-sm py-md">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-headline-md font-black">T</div>
<div>
<div class="font-headline-md text-headline-md font-black text-primary leading-tight">TaskMaster Admin</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">admin@taskmaster.com</div>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-sm px-md rounded-lg flex items-center justify-center gap-sm hover:bg-primary transition-colors duration-200 mt-sm mb-lg shadow-sm">
<span class="material-symbols-outlined" data-icon="add">add</span>
            New Task
        </button>
<div class="flex-1 flex flex-col gap-xs overflow-y-auto">
<a class="text-on-surface-variant hover:bg-surface-container hover:bg-surface-container-high transition-all duration-150 active:scale-95 flex items-center gap-md px-md py-sm rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span>Dashboard</span>
</a>
<a class="bg-secondary-container text-on-secondary-container font-semibold rounded-lg flex items-center gap-md px-md py-sm" href="#">
<span class="material-symbols-outlined icon-fill" data-icon="assignment">assignment</span>
<span>Tasks</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container hover:bg-surface-container-high transition-all duration-150 active:scale-95 flex items-center gap-md px-md py-sm rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span>Users</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container hover:bg-surface-container-high transition-all duration-150 active:scale-95 flex items-center gap-md px-md py-sm rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="category">category</span>
<span>Categories</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container hover:bg-surface-container-high transition-all duration-150 active:scale-95 flex items-center gap-md px-md py-sm rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span>Settings</span>
</a>
</div>
<div class="mt-auto pt-md border-t border-outline-variant flex flex-col gap-xs">
<a class="text-on-surface-variant hover:bg-surface-container hover:bg-surface-container-high transition-all duration-150 active:scale-95 flex items-center gap-md px-md py-sm rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="help">help</span>
<span>Help Center</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container hover:bg-surface-container-high transition-all duration-150 active:scale-95 flex items-center gap-md px-md py-sm rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span>Logout</span>
</a>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 md:ml-64 h-full overflow-y-auto bg-surface flex flex-col">
<!-- Top App Bar for Mobile (Hidden on Desktop) -->
<header class="md:hidden bg-surface-container-lowest sticky top-0 z-40 border-b border-outline-variant px-margin-mobile py-sm flex justify-between items-center shadow-sm">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">TaskMaster</div>
<button class="text-on-surface-variant p-sm rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</header>
<div class="p-margin-mobile md:p-margin-desktop max-w-[1280px] mx-auto w-full flex-1">
<div class="mb-lg flex items-center gap-sm">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-lg" data-icon="arrow_back">arrow_back</span>
</a>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Create New Task</h1>
</div>
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-xl max-w-3xl">
<form class="flex flex-col gap-lg">
<!-- Title -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="task-title">Task Title <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200 outline-none" id="task-title" placeholder="e.g., Update Q3 Marketing Deck" required="" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="task-desc">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200 outline-none resize-y" id="task-desc" placeholder="Provide detailed context for this task..." rows="4"></textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Due Date -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="task-date">Due Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-md pr-10 py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200 outline-none appearance-none" id="task-date" type="date"/>
</div>
</div>
<!-- Priority -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="task-priority">Priority</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-md pr-10 py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all duration-200 outline-none appearance-none cursor-pointer" id="task-priority">
<option value="low">Low Priority</option>
<option selected="" value="medium">Medium Priority</option>
<option value="high">High Priority</option>
<option value="urgent">Urgent</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Category -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface">Category</label>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio" value="design"/>
<div class="px-md py-sm rounded-full border border-outline-variant font-label-sm text-label-sm text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-all hover:bg-surface-container">
                                    Design
                                </div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="category" type="radio" value="engineering"/>
<div class="px-md py-sm rounded-full border border-outline-variant font-label-sm text-label-sm text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-all hover:bg-surface-container">
                                    Engineering
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio" value="marketing"/>
<div class="px-md py-sm rounded-full border border-outline-variant font-label-sm text-label-sm text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-all hover:bg-surface-container">
                                    Marketing
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio" value="operations"/>
<div class="px-md py-sm rounded-full border border-outline-variant font-label-sm text-label-sm text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary-container transition-all hover:bg-surface-container">
                                    Operations
                                </div>
</label>
</div>
</div>
<hr class="border-outline-variant my-sm"/>
<!-- Actions -->
<div class="flex justify-end gap-md">
<button class="px-lg py-sm font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors duration-200" type="button">
                            Cancel
                        </button>
<button class="bg-primary-container text-on-primary px-lg py-sm rounded-lg font-label-md text-label-md hover:bg-primary transition-colors duration-200 shadow-sm flex items-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="check">check</span>
                            Create Task
                        </button>
</div>
</form>
</div>
</div>
</main>
</body></html>
