<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TaskMaster - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f2f4f6",
                        "primary-container": "#2563eb",
                        "surface": "#f7f9fb",
                        "on-primary-container": "#eeefff",
                        "surface-dim": "#d8dadc",

                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "on-surface": "#191c1e",
                        "on-primary-fixed": "#00174b",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-container": "#54647a",
                        "surface-container": "#eceef0",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-container": "#0074a6",
                        "error-container": "#ffdad6",
                        "outline": "#737686",
                        "background": "#f7f9fb",
                        "primary": "#004ac6",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-fixed": "#dbe1ff",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#c9e6ff",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "secondary-container": "#d0e1fb",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-fixed": "#001e2f",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary": "#505f76",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed-dim": "#89ceff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-container": "#e4f2ff",
                        "secondary-fixed": "#d3e4fe",
                        "surface-variant": "#e0e3e5",
                        "on-background": "#191c1e",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-tint": "#0053db"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "margin-desktop": "40px",
                        "sm": "8px",
                        "2xl": "48px",
                        "gutter": "24px",
                        "3xl": "64px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],

                    "fontSize": {

                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopNavBar (Public, suppress nav items for login intent) -->
<header class="bg-surface-container-lowest border-b border-outline-variant shadow-sm w-full sticky top-0 z-50">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full max-w-[1280px] mx-auto">
<div class="flex items-center">
<span class="font-headline-md text-headline-md font-bold text-primary">TaskMaster</span>
</div>
<!-- Navigation links suppressed due to transactional intent -->
<div class="flex items-center gap-sm">
<!-- Empty for clean login intent -->
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] p-[1.25rem] md:p-lg overflow-hidden relative">
<!-- Decorative accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-tertiary"></div>
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your tasks efficiently.</p>
</div>
<form class="space-y-md">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-[#2563EB] focus:ring-4 focus:ring-[#2563EB]/10 transition-shadow" id="email" name="email" placeholder="alex.rivera@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-[#2563EB] focus:ring-4 focus:ring-[#2563EB]/10 transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-[#2563EB]/10 border-outline-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember Me
                        </label>
</div>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Sign In Button -->
<button class="w-full mt-lg flex justify-center items-center py-sm px-md border border-transparent rounded-lg text-on-primary bg-[#2563EB] hover:bg-[#1D4ED8] focus:outline-none focus:ring-4 focus:ring-[#2563EB]/20 font-label-md text-label-md transition-colors shadow-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined ml-xs text-[18px]">login</span>
</button>
</form>
<!-- Sign Up Prompt -->
<div class="mt-lg text-center pt-md border-t border-outline-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-xs" href="#">
                        Sign up for a new account
                    </a>
</p>
</div>
</div>
</main>
</body></html>
