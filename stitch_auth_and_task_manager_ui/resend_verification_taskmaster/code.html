<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Abstract Background Elements for visual interest in a sparse screen -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-20 blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[50%] h-[50%] rounded-full bg-secondary-fixed opacity-20 blur-3xl mix-blend-multiply"></div>
</div>

<div class="relative z-10 w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] p-xl md:p-2xl">

<div class="flex flex-col items-center text-center mb-lg">
<div class="w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">
                        mark_email_unread
                    </span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">
                    Check your inbox
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    We sent a verification link to your email. Didn't receive it? Let's try sending it again.
                </p>
</div>
<!-- Form -->
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">
                        Confirm Email Address
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">
                                mail
                            </span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all duration-200" id="email" name="email" placeholder="alex.rivera@example.com" required="" type="email" value="alex.rivera@example.com"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-on-primary bg-primary-container hover:bg-[#1D4ED8] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container font-label-md text-label-md transition-colors duration-200" type="submit">
<span class="material-symbols-outlined mr-2 text-[20px]">
                            send
                        </span>

                    </button>
</div>
</form>
