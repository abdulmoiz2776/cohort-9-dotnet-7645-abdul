        body {
            background-color: #F8FAFC; /* Level 0 Background */

<body class="h-full flex flex-col font-body-md text-body-md text-on-surface">
<!-- Note: TopNavBar is suppressed as this is a linear/transactional flow (password reset), prioritizing the content canvas. -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_20px_25px_-5px_rgba(15,23,42,0.1)] border border-outline-variant p-2xl">
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-sm">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 0;">key</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Forgot Password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your email and we'll send you a link to reset your password.</p>
</div>
<form class="space-y-lg">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-size: 20px;">mail</span>
</div>
<input class="block w-full pl-lg py-sm border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring focus:ring-primary-container/10 transition-shadow outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full py-sm px-md bg-primary-container text-on-primary rounded-lg font-label-md text-label-md hover:bg-[#1D4ED8] transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" type="submit">
                    Send Reset Link
                </button>
</form>
<div class="mt-xl text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-secondary hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>
</body></html>
